<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3b32">
<title>বিসমিল্লাহ মেডিকেল হল</title>
<style>
:root{--green:#0b3b32;--green2:#087b50;--mint:#e9f5ef;--bg:#f3f6f5;--card:#fff;--ink:#172b27;--muted:#71817c;--line:#e1e9e5;--gold:#c6a45a;--red:#c43d3d;--orange:#c17b18;--blue:#2563eb;--shadow:0 5px 20px #183b3010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Noto Sans Bengali","Nirmala UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:linear-gradient(180deg,#0b3b32,#062b25);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 20px;border-bottom:1px solid #ffffff24;margin-bottom:15px}.brand-icon{width:42px;height:42px;border-radius:14px;background:#e5f4eb;color:#087b50;display:grid;place-items:center;font-size:24px;font-weight:900}.brand b{font-size:17px;display:block}.brand small{color:#b8d1c7}.nav{display:grid;gap:5px}.nav button{color:#d4e5df;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#087b50;color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:25px;padding:12px;border:1px solid #ffffff30;border-radius:12px;color:#d4e5df;font-size:12px}.main{margin-left:245px;width:calc(100% - 245px);min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.top-left{display:flex;align-items:center;gap:14px}.hamb{display:none;background:none;font-size:22px}.date{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.pill{background:var(--mint);color:var(--green);padding:7px 12px;border-radius:20px;font-weight:700}.content{max-width:1500px;margin:auto;padding:24px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.page-head h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted)}.btn{padding:9px 14px;border-radius:9px;background:var(--green2);color:#fff;font-weight:650}.btn:hover{filter:brightness(.95)}.btn.secondary{background:var(--mint);color:var(--green)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px;position:relative}.stat .label{color:var(--muted);font-size:12px}.stat strong{font-size:23px;display:block;margin-top:7px}.stat .symbol{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:18px}.stat.red strong{color:var(--red)}.stat.orange strong{color:var(--orange)}.layout2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.card{padding:17px;margin-bottom:15px}.card h3{margin:0 0 14px;font-size:16px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{background:#f6faf8;border:1px solid var(--line);border-radius:11px;padding:13px 8px;color:var(--green);font-weight:650}.quick button span{display:block;font-size:21px;margin-bottom:4px}.alerts{display:grid;gap:9px}.alert{padding:10px;border-radius:9px;background:#fff8e9;color:#89580d}.alert.red{background:#fff0ef;color:var(--red)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d4dfda;border-radius:9px;padding:10px;background:#fff;width:100%;color:var(--ink)}.toolbar input{max-width:340px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted);background:#f8faf9}tr:last-child td{border-bottom:0}.tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--mint);color:var(--green)}.tag.red{background:#fff0ef;color:var(--red)}.tag.orange{background:#fff6e6;color:var(--orange)}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:24px}.total-line{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;padding:12px 0}.muted{color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#123e33;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none}.modal-back{position:fixed;inset:0;background:#061e19a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:15}.modal{background:white;border-radius:16px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}.footer-note{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.hamb{display:block}.topbar{padding:0 13px}.content{padding:15px}.page-head h1{font-size:21px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.form-grid,.two{grid-template-columns:1fr}.date{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-icon">✚</div><div><b id="brandName">মেডিকেয়ার ফার্মেসি</b><small>Pharmacy Management</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>ড্যাশবোর্ড</button>
  <button data-page="medicines"><span class="ico">💊</span>ওষুধ ও স্টক</button>
  <button data-page="sales"><span class="ico">🛒</span>বিক্রয় (POS)</button>
  <button data-page="purchases"><span class="ico">📦</span>ক্রয়</button>
  <button data-page="customers"><span class="ico">👥</span>কাস্টমার</button>
  <button data-page="suppliers"><span class="ico">🚚</span>সরবরাহকারী</button>
  <button data-page="expenses"><span class="ico">💳</span>খরচ ও হিসাব</button>
  <button data-page="reports"><span class="ico">📊</span>রিপোর্ট</button>
  <button data-page="settings"><span class="ico">⚙️</span>সেটিংস ও ব্যাকআপ</button>
 </nav>
 <div class="side-foot">অফলাইন Android সংস্করণ<br>এই ডিভাইসেই ডেটা সংরক্ষিত হয়।</div>
</aside>
<div class="main">
 <header class="topbar"><div class="top-left"><button class="hamb" id="hamb">☰</button><span class="date" id="today"></span></div><div class="top-actions"><span class="pill">৳ BDT</span><span>👤 Admin</span></div></header>
 <main class="content" id="view"></main>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<script>
const KEY='pharmacy_manager_v1';
const fresh={shop:{name:'বিসমিল্লাহ মেডিকেল হল',phone:'',address:''},medicines:[],sales:[],purchases:[],customers:[],suppliers:[],expenses:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(fresh)}catch(e){db=structuredClone(fresh)}
const $=s=>document.querySelector(s), money=n=>'৳ '+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(p){$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');({dashboard,medicines,sales,purchases,customers,suppliers,expenses,reports,settings}[p]||dashboard)()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});
$('#hamb').onclick=()=>$('#sidebar').classList.toggle('open');$('#today').textContent=new Date().toLocaleDateString('bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function head(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${button}</div>`}
function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">এখনো কোনো তথ্য নেই</td></tr>`}</tbody></table></div>`}
function dashboard(){
 let salesToday=db.sales.filter(x=>x.date===today()),sale=salesToday.reduce((a,x)=>a+x.total,0),cost=salesToday.reduce((a,x)=>a+x.cost,0),stock=db.medicines.reduce((a,x)=>a+x.qty*x.buy,0),low=db.medicines.filter(x=>x.qty<=x.min),expired=db.medicines.filter(x=>x.expiry&&x.expiry<today()&&x.qty>0),near=db.medicines.filter(x=>x.expiry&&x.expiry>=today()&&(new Date(x.expiry)-new Date())/86400000<=60&&x.qty>0),due=db.sales.reduce((a,x)=>a+x.due,0);
 $('#view').innerHTML=head('স্বাগতম, '+safe(db.shop.name),'আজকের ব্যবসার সার্বিক অবস্থা')+`<div class="stats">
 <div class="stat"><span class="symbol">🛒</span><div class="label">আজকের বিক্রি</div><strong>${money(sale)}</strong></div>
 <div class="stat"><span class="symbol">📈</span><div class="label">আজকের আনুমানিক লাভ</div><strong>${money(sale-cost)}</strong></div>
 <div class="stat"><span class="symbol">💊</span><div class="label">মোট ওষুধ</div><strong>${db.medicines.length}</strong></div>
 <div class="stat"><span class="symbol">🏷️</span><div class="label">স্টকের ক্রয়মূল্য</div><strong>${money(stock)}</strong></div>
 <div class="stat orange"><span class="symbol">⚠️</span><div class="label">স্টক কম</div><strong>${low.length} আইটেম</strong></div>
 <div class="stat red"><span class="symbol">⛔</span><div class="label">মেয়াদ শেষ</div><strong>${expired.length} আইটেম</strong></div>
 <div class="stat orange"><span class="symbol">📅</span><div class="label">৬০ দিনের মধ্যে মেয়াদ শেষ</div><strong>${near.length} আইটেম</strong></div>
 <div class="stat"><span class="symbol">📒</span><div class="label">কাস্টমার বাকি</div><strong>${money(due)}</strong></div></div>
 <div class="layout2">${card('দ্রুত কাজ (Quick Actions)',`<div class="quick"><button onclick="page('sales')"><span>🛒</span>নতুন বিক্রি</button><button onclick="page('purchases')"><span>📦</span>নতুন ক্রয়</button><button onclick="openMedicine()"><span>💊</span>নতুন ওষুধ</button><button onclick="page('reports')"><span>📊</span>রিপোর্ট</button></div>`)}
 ${card('স্মার্ট অ্যালার্ট',`<div class="alerts">${expired.length?`<div class="alert red">⛔ ${expired.length}টি ওষুধের মেয়াদ শেষ — বিক্রি বন্ধ রাখুন</div>`:''}${near.length?`<div class="alert">📅 ${near.length}টি ওষুধের মেয়াদ ৬০ দিনের মধ্যে</div>`:''}${low.length?`<div class="alert">⚠️ ${low.length}টি ওষুধের স্টক কম</div>`:''}${!expired.length&&!near.length&&!low.length?'<div class="muted">এই মুহূর্তে কোনো সতর্কতা নেই।</div>':''}</div>`)}
 </div>${card('সাম্প্রতিক বিক্রি',table(['তারিখ','মেমো','ক্রেতা','মোট','বাকি'],db.sales.slice(-6).reverse().map(s=>`<tr><td>${s.date}</td><td>${s.no}</td><td>${safe(s.customer||'সাধারণ ক্রেতা')}</td><td>${money(s.total)}</td><td>${money(s.due)}</td></tr>`)))}`;
}
function medicines(){
 $('#view').innerHTML=head('ওষুধ ও স্টক','ওষুধ যোগ করুন, খুঁজুন এবং স্টক নিয়ন্ত্রণ করুন',`<button class="btn" onclick="openMedicine()">+ নতুন ওষুধ</button>`)+card('ওষুধের তালিকা',`<div class="toolbar"><input id="medSearch" placeholder="ওষুধ, জেনেরিক, কোম্পানি বা ব্যাচ খুঁজুন..." oninput="renderMedRows()"><select id="medFilter" onchange="renderMedRows()"><option value="">সব ওষুধ</option><option value="low">স্টক কম</option><option value="expired">মেয়াদ শেষ</option><option value="near">মেয়াদ কাছাকাছি</option></select></div><div id="medRows"></div>`);
 renderMedRows();
}
function renderMedRows(){
 let q=($('#medSearch')?.value||'').toLowerCase(),f=$('#medFilter')?.value||'';
 let arr=db.medicines.filter(m=>[m.name,m.generic,m.company,m.batch].join(' ').toLowerCase().includes(q)).filter(m=>!f||(f==='low'?m.qty<=m.min:f==='expired'?m.expiry&&m.expiry<today():f==='near'?m.expiry&&m.expiry>=today()&&(new Date(m.expiry)-new Date())/86400000<=60:false));
 $('#medRows').innerHTML=table(['ওষুধ','জেনেরিক / কোম্পানি','ব্যাচ','স্টক','ক্রয়','বিক্রয়','মেয়াদ','অ্যাকশন'],arr.map(m=>`<tr><td><b>${safe(m.name)}</b><br><small>${safe(m.form||'')}</small></td><td>${safe(m.generic)}<br><small>${safe(m.company)}</small></td><td>${safe(m.batch)}</td><td>${m.qty} ${m.unit||'টি'} ${m.qty<=m.min?'<span class="tag orange">কম</span>':''}</td><td>${money(m.buy)}</td><td>${money(m.sell)}</td><td>${m.expiry||'—'} ${m.expiry&&m.expiry<today()?'<span class="tag red">শেষ</span>':''}</td><td><button class="btn secondary small" onclick="editMedicine('${m.id}')">এডিট</button> <button class="btn danger small" onclick="deleteMedicine('${m.id}')">মুছুন</button></td></tr>`));
}
function openMedicine(m={}){
 $('#modal').innerHTML=`<h3>${m.id?'ওষুধ এডিট':'নতুন ওষুধ যোগ করুন'}</h3><form id="medForm"><div class="form-grid">
 ${field('ওষুধের নাম','name',m.name,'text',true)}${field('জেনেরিক নাম','generic',m.generic)}${field('কোম্পানি','company',m.company)}${field('Strength / Form','form',m.form)}${field('ব্যাচ নম্বর','batch',m.batch)}${field('পরিমাণ','qty',m.qty??0,'number')}${field('ন্যূনতম স্টক','min',m.min??5,'number')}${field('ক্রয় মূল্য','buy',m.buy??0,'number')}${field('বিক্রয় মূল্য','sell',m.sell??0,'number')}${field('মেয়াদ শেষ','expiry',m.expiry,'date')}${field('একক','unit',m.unit||'টি')}
 </div><div class="actions"><button class="btn">সংরক্ষণ</button><button type="button" class="btn secondary" onclick="closeModal()">বাতিল</button></div></form>`;
 showModal();$('#medForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.qty=+d.qty;d.min=+d.min;d.buy=+d.buy;d.sell=+d.sell;if(m.id)Object.assign(db.medicines.find(x=>x.id===m.id),d);else db.medicines.push({id:id(),...d});save();closeModal();medicines();toast('ওষুধ সংরক্ষণ হয়েছে')};
}
function field(label,name,value='',type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${safe(value??'')}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function editMedicine(i){let m=db.medicines.find(x=>x.id===i);openMedicine(m)}
function deleteMedicine(i){if(confirm('ওষুধটি মুছে ফেলবেন?')){db.medicines=db.medicines.filter(x=>x.id!==i);save();renderMedRows();toast('মুছে ফেলা হয়েছে')}}
function sales(){
 $('#view').innerHTML=head('বিক্রয় (POS)','ওষুধ বিক্রি, পেমেন্ট ও মেমো তৈরি')+`<div class="two"><section class="card"><h3>পণ্য যোগ করুন</h3><div class="field"><label>ওষুধ নির্বাচন</label><select id="saleMed"><option value="">ওষুধ নির্বাচন করুন</option>${db.medicines.map(m=>`<option value="${m.id}">${safe(m.name)} — স্টক ${m.qty} — ${money(m.sell)}</option>`).join('')}</select></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>পরিমাণ</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field" style="align-self:end"><button class="btn" onclick="addSaleCart()">কার্টে যোগ</button></div></div></section><section class="card"><h3>বিক্রির তথ্য</h3><div class="field"><label>ক্রেতার নাম</label><input id="saleCustomer" list="customerOptions"><datalist id="customerOptions">${db.customers.map(c=>`<option value="${safe(c.name)}">`).join('')}</datalist></div><div class="field" style="margin-top:9px"><label>ছাড় (৳)</label><input id="saleDiscount" type="number" min="0" value="0" oninput="renderSaleCart()"></div><div class="field" style="margin-top:9px"><label>জমা (খালি রাখলে পুরো টাকা)</label><input id="salePaid" type="number" min="0"></div></section></div>${card('বিক্রির কার্ট',`<div id="saleCart"></div><div class="total-line"><span>সর্বমোট</span><span id="saleTotal">৳ ০</span></div><div class="actions"><button class="btn" onclick="completeSale()">বিক্রি সম্পন্ন ও মেমো</button><button class="btn secondary" onclick="saleCart=[];renderSaleCart()">কার্ট খালি করুন</button></div>`)}`;
 saleCart=[];renderSaleCart();
}
let saleCart=[];
function addSaleCart(){let m=db.medicines.find(x=>x.id===$('#saleMed').value),q=+$('#saleQty').value;if(!m||q<1)return toast('সঠিক ওষুধ ও পরিমাণ দিন');if(m.expiry&&m.expiry<today())return toast('মেয়াদোত্তীর্ণ ওষুধ বিক্রি করা যাবে না');let c=saleCart.find(x=>x.id===m.id),already=c?c.qty:0;if(q+already>m.qty)return toast('স্টকে পর্যাপ্ত পরিমাণ নেই');if(c)c.qty+=q;else saleCart.push({id:m.id,name:m.name,qty:q,price:m.sell,buy:m.buy});renderSaleCart()}
function renderSaleCart(){let el=$('#saleCart');if(!el)return;el.innerHTML=table(['ওষুধ','পরিমাণ','দর','মোট',''],saleCart.map((x,i)=>`<tr><td>${safe(x.name)}</td><td><input style="width:70px" type="number" min="1" value="${x.qty}" onchange="changeCartQty(${i},this.value)"></td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="btn danger small" onclick="saleCart.splice(${i},1);renderSaleCart()">বাদ</button></td></tr>`));let sub=saleCart.reduce((a,x)=>a+x.qty*x.price,0),d=+($('#saleDiscount')?.value||0);$('#saleTotal').textContent=money(Math.max(0,sub-d))}
function changeCartQty(i,v){let q=+v,m=db.medicines.find(x=>x.id===saleCart[i].id);if(q<1||q>m.qty){toast('স্টক সীমা অতিক্রম করা যাবে না');renderSaleCart();return}saleCart[i].qty=q;renderSaleCart()}
function completeSale(){if(!saleCart.length)return toast('কার্টে ওষুধ যোগ করুন');let sub=saleCart.reduce((a,x)=>a+x.qty*x.price,0),discount=+$('#saleDiscount').value||0,total=Math.max(0,sub-discount),paid=$('#salePaid').value===''?total:+$('#salePaid').value;if(discount>sub||paid<0||paid>total)return toast('ছাড় বা জমার পরিমাণ যাচাই করুন');let customer=$('#saleCustomer').value.trim(),s={id:id(),no:'INV-'+(db.sales.length+1001),date:today(),customer,items:saleCart.map(x=>({...x})),discount,total,paid,due:total-paid,cost:saleCart.reduce((a,x)=>a+x.qty*x.buy,0)};if(s.due>0&&!customer)return toast('বাকি থাকলে ক্রেতার নাম দিন');saleCart.forEach(x=>db.medicines.find(m=>m.id===x.id).qty-=x.qty);db.sales.push(s);if(customer&&!db.customers.some(c=>c.name===customer))db.customers.push({id:id(),name:customer,phone:''});save();printInvoice(s);sales();toast('বিক্রি সম্পন্ন হয়েছে')}
function printInvoice(s){let w=window.open('','_blank','width=420,height=650');if(!w){toast('পপ-আপ অনুমতি দিন');return}w.document.write(`<html><meta charset="utf-8"><title>Invoice</title><body style="font:14px system-ui;padding:15px"><center><h2>${safe(db.shop.name)}</h2><p>${safe(db.shop.address)}<br>${safe(db.shop.phone)}</p><b>বিক্রয় মেমো</b><p>${s.no} | ${s.date}<br>ক্রেতা: ${safe(s.customer||'সাধারণ ক্রেতা')}</p></center><hr><table style="width:100%;border-collapse:collapse">${s.items.map(x=>`<tr><td>${safe(x.name)} × ${x.qty}</td><td align="right">${money(x.qty*x.price)}</td></tr>`).join('')}</table><hr><p>ছাড়: ${money(s.discount)}<br><b>মোট: ${money(s.total)}</b><br>জমা: ${money(s.paid)}<br>বাকি: ${money(s.due)}</p><center>ধন্যবাদ, আবার আসবেন</center><script>window.print()<\/script></body></html>`);w.document.close()}
function purchases(){
 $('#view').innerHTML=head('ক্রয় ব্যবস্থাপনা','নতুন ক্রয় এন্ট্রি এবং স্টক বৃদ্ধি')+`<section class="card"><h3>নতুন ক্রয়</h3><form id="purchaseForm"><div class="form-grid">${field('সরবরাহকারীর নাম','supplier','','text',true)}${field('ওষুধের নাম','medicine','','text',true)}${field('ব্যাচ নম্বর','batch')}${field('পরিমাণ','qty',1,'number')}${field('প্রতি পিস ক্রয় মূল্য','price',0,'number')}${field('মেয়াদ শেষ','expiry','','date')}${field('পরিশোধ','paid',0,'number')}</div><div class="actions"><button class="btn">ক্রয় সংরক্ষণ করুন</button></div></form></section>`+card('ক্রয়ের ইতিহাস',table(['তারিখ','ইনভয়েস','সরবরাহকারী','ওষুধ','পরিমাণ','মোট','বাকি'],db.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${p.no}</td><td>${safe(p.supplier)}</td><td>${safe(p.medicine)}</td><td>${p.qty}</td><td>${money(p.total)}</td><td>${money(p.due)}</td></tr>`)));
 $('#purchaseForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.qty=+d.qty;d.price=+d.price;d.paid=+d.paid;d.total=d.qty*d.price;if(d.qty<1||d.price<0||d.paid>d.total)return toast('ক্রয়ের তথ্য যাচাই করুন');let m=db.medicines.find(x=>x.name.toLowerCase()===d.medicine.toLowerCase()&&x.batch===d.batch&&x.expiry===d.expiry);if(m)m.qty+=d.qty;else db.medicines.push({id:id(),name:d.medicine,generic:'',company:d.supplier,batch:d.batch,qty:d.qty,min:5,buy:d.price,sell:d.price,expiry:d.expiry,unit:'টি'});db.purchases.push({id:id(),no:'PUR-'+(db.purchases.length+1),date:today(),supplier:d.supplier,medicine:d.medicine,qty:d.qty,total:d.total,paid:d.paid,due:d.total-d.paid});if(!db.suppliers.some(x=>x.name===d.supplier))db.suppliers.push({id:id(),name:d.supplier,phone:''});save();purchases();toast('ক্রয় সংরক্ষণ হয়েছে')};
}
function customers(){let dueMap={};db.sales.forEach(s=>{if(s.customer)dueMap[s.customer]=(dueMap[s.customer]||0)+s.due});$('#view').innerHTML=head('কাস্টমার ম্যানেজমেন্ট','ক্রেতার তথ্য ও বকেয়া হিসাব',`<button class="btn" onclick="addPerson('customer')">+ কাস্টমার যোগ</button>`)+card('কাস্টমার তালিকা',table(['নাম','ফোন','বাকি','অ্যাকশন'],db.customers.map(c=>`<tr><td>${safe(c.name)}</td><td>${safe(c.phone)}</td><td>${money(dueMap[c.name]||0)}</td><td><button class="btn secondary small" onclick="collectDue('${c.id}')">বাকি আদায়</button></td></tr>`)))}
function suppliers(){let dueMap={};db.purchases.forEach(p=>{dueMap[p.supplier]=(dueMap[p.supplier]||0)+p.due});$('#view').innerHTML=head('সরবরাহকারী','সরবরাহকারীর তথ্য ও ক্রয়ের বাকি',`<button class="btn" onclick="addPerson('supplier')">+ সরবরাহকারী যোগ</button>`)+card('সরবরাহকারী তালিকা',table(['নাম','ফোন','ক্রয় বাকি'],db.suppliers.map(c=>`<tr><td>${safe(c.name)}</td><td>${safe(c.phone)}</td><td>${money(dueMap[c.name]||0)}</td></tr>`)))}
function addPerson(type){let label=type==='customer'?'কাস্টমার':'সরবরাহকারী';$('#modal').innerHTML=`<h3>নতুন ${label}</h3><form id="personForm"><div class="form-grid">${field('নাম','name','','text',true)}${field('ফোন','phone')}${field('ঠিকানা','address')}</div><div class="actions"><button class="btn">সংরক্ষণ</button></div></form>`;showModal();$('#personForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db[type==='customer'?'customers':'suppliers'].push({id:id(),...d});save();closeModal();type==='customer'?customers():suppliers();toast('তথ্য সংরক্ষিত হয়েছে')}}
function collectDue(cid){let c=db.customers.find(x=>x.id===cid),amount=+prompt(c.name+' এর কাছ থেকে কত টাকা জমা নিলেন?');if(!(amount>0))return;for(let s of db.sales.filter(x=>x.customer===c.name&&x.due>0)){let n=Math.min(amount,s.due);s.due-=n;s.paid+=n;amount-=n;if(amount<=0)break}save();customers();toast('পেমেন্ট আপডেট হয়েছে')}
function expenses(){ $('#view').innerHTML=head('খরচ ও হিসাব','দোকানের দৈনন্দিন খরচ যোগ করুন')+`<section class="card"><h3>নতুন খরচ</h3><form id="expenseForm"><div class="form-grid">${field('খরচের বিবরণ','note','','text',true)}${field('টাকা','amount',0,'number')}${field('তারিখ','date',today(),'date')}</div><div class="actions"><button class="btn">খরচ সংরক্ষণ</button></div></form></section>`+card('খরচের তালিকা',table(['তারিখ','বিবরণ','টাকা'],db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${safe(x.note)}</td><td>${money(x.amount)}</td></tr>`)));
 $('#expenseForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.amount=+d.amount;if(!d.amount||d.amount<0)return toast('টাকার পরিমাণ দিন');db.expenses.push({id:id(),...d});save();expenses();toast('খরচ সংরক্ষিত হয়েছে')}}
function reports(){let rev=db.sales.reduce((a,x)=>a+x.total,0),cost=db.sales.reduce((a,x)=>a+x.cost,0),exp=db.expenses.reduce((a,x)=>a+x.amount,0),purchase=db.purchases.reduce((a,x)=>a+x.total,0);$('#view').innerHTML=head('ব্যবসায়িক রিপোর্ট','সামগ্রিক বিক্রি, ক্রয় ও লাভ-ক্ষতির সারাংশ')+`<div class="stats"><div class="stat"><div class="label">মোট বিক্রি</div><strong>${money(rev)}</strong></div><div class="stat"><div class="label">মোট ক্রয়</div><strong>${money(purchase)}</strong></div><div class="stat"><div class="label">বিক্রিত পণ্যের ক্রয়মূল্য</div><strong>${money(cost)}</strong></div><div class="stat red"><div class="label">মোট খরচ</div><strong>${money(exp)}</strong></div></div>`+card('আর্থিক সারাংশ',`<div class="total-line"><span>মোট বিক্রি</span><span>${money(rev)}</span></div><div class="total-line"><span>বিক্রিত পণ্যের ক্রয়মূল্য</span><span>${money(cost)}</span></div><div class="total-line"><span>আনুমানিক গ্রস লাভ</span><span>${money(rev-cost)}</span></div><div class="total-line"><span>অপারেটিং খরচ</span><span>${money(exp)}</span></div><div class="total-line"><span>আনুমানিক নিট লাভ</span><span>${money(rev-cost-exp)}</span></div><button class="btn" onclick="exportCSV()">CSV রিপোর্ট ডাউনলোড</button>`) +card('বিক্রির ইতিহাস',table(['তারিখ','মেমো','ক্রেতা','বিক্রি','জমা','বাকি'],db.sales.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${s.no}</td><td>${safe(s.customer)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.due)}</td></tr>`)))}
function exportCSV(){let rows=[['Date','Invoice','Customer','Total','Paid','Due'],...db.sales.map(s=>[s.date,s.no,s.customer,s.total,s.paid,s.due])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('sales-report.csv',csv,'text/csv;charset=utf-8')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function settings(){$('#view').innerHTML=head('সেটিংস ও ব্যাকআপ','দোকানের তথ্য, ডেটা সংরক্ষণ ও পুনরুদ্ধার')+`<section class="card"><h3>দোকানের তথ্য</h3><form id="shopForm"><div class="form-grid">${field('দোকানের নাম','name',db.shop.name,'text',true)}${field('ফোন','phone',db.shop.phone)}${field('ঠিকানা','address',db.shop.address)}</div><div class="actions"><button class="btn">সেটিংস সংরক্ষণ</button></div></form></section>`+card('ডেটা ব্যাকআপ',`<p class="muted">এই ডিভাইসের সব ডেটা JSON ফাইলে ডাউনলোড করুন। নিরাপদ স্থানে রাখুন।</p><div class="actions"><button class="btn" onclick="backup()">ব্যাকআপ ডাউনলোড</button><label class="btn secondary">ব্যাকআপ ফিরিয়ে আনুন<input type="file" accept=".json" hidden onchange="restore(this)"></label><button class="btn danger" onclick="clearData()">সব ডেটা মুছুন</button></div><p class="footer-note">সতর্কতা: এই সংস্করণে ডেটা শুধু এই ব্রাউজারের localStorage-এ থাকে। ব্রাউজার ডেটা মুছে গেলে ব্যাকআপ ছাড়া তথ্য হারাতে পারেন।</p>`);
 $('#shopForm').onsubmit=e=>{e.preventDefault();db.shop=Object.fromEntries(new FormData(e.target));save();$('#brandName').textContent=db.shop.name;settings();toast('সেটিংস সংরক্ষিত হয়েছে')}}
function backup(){download('pharmacy-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('ব্যাকআপ ডাউনলোড শুরু হয়েছে')}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.medicines||!x.sales)throw 0;if(confirm('বর্তমান ডেটা প্রতিস্থাপন করবেন?')){db=x;save();location.reload()}}catch(e){toast('সঠিক ব্যাকআপ ফাইল নয়')}};r.readAsText(f)}
function clearData(){if(confirm('সব ডেটা স্থায়ীভাবে মুছে ফেলবেন? আগে ব্যাকআপ নিন।')){localStorage.removeItem(KEY);location.reload()}}
function showModal(){$('#modalBack').style.display='flex'}function closeModal(){$('#modalBack').style.display='none'}$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
$('#brandName').textContent=db.shop.name;page('dashboard');
</script>
</body></html>
